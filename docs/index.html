<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7A0A1F"><style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>લગ્ન માર્ગદર્શિકા</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Saurashtra Leuva Patel wedding rituals guide with item lists and to-do lists – Gujarati, English, Hindi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta+Vaani:wght@500;700;800&family=Hind+Vadodara:wght@400;500;600&family=Hind:wght@400;500;600&family=Mukta:wght@600;700&display=swap">
<style>
/* Layout: one narrow column (max 560px) like a phone app — red kanku header band,
   ritual timeline on home, ritual page with three big tabs, fixed bottom nav. */
:root{
  --kanku:#A8102B;      /* sindoor red: header, primary buttons */
  --kanku-deep:#7A0A1F;
  --haldi:#E8A317;      /* turmeric: highlights, progress */
  --leaf:#2E6B34;       /* ashopalav toran green: done state */
  --bg:#FFFDFB;
  --surface:#FFFFFF;
  --surface-2:#FBF1EC;  /* faint kanku tint */
  --fg:#2A1418;
  --muted:#6E5357;
  --line:#EAD7D0;
  --on-kanku:#FFF7EE;
  --done-bg:#EAF4EA;
  --focus:#1F5FBF;
  --f-head:"Mukta Vaani","Mukta","Noto Sans Gujarati",system-ui,sans-serif;
  --f-body:"Hind Vadodara","Hind","Noto Sans Gujarati","Noto Sans Devanagari",system-ui,sans-serif;
  --fs:18px;
  --radius:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --kanku:#E04B62;--kanku-deep:#5E0A1A;--haldi:#F2B93B;--leaf:#6FBF73;
  --bg:#170D0F;--surface:#221417;--surface-2:#2C1A1E;--fg:#F6ECE9;--muted:#C2A9AD;
  --line:#3D2A2E;--on-kanku:#FFF7EE;--done-bg:#1C2C1D;--focus:#8AB4FF;color-scheme:dark}}
:root[data-theme="dark"]{
  --kanku:#E04B62;--kanku-deep:#5E0A1A;--haldi:#F2B93B;--leaf:#6FBF73;
  --bg:#170D0F;--surface:#221417;--surface-2:#2C1A1E;--fg:#F6ECE9;--muted:#C2A9AD;
  --line:#3D2A2E;--on-kanku:#FFF7EE;--done-bg:#1C2C1D;--focus:#8AB4FF;color-scheme:dark}

html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:1rem;line-height:1.6;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--kanku-deep)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-head);line-height:1.25;text-wrap:balance;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--kanku-deep);color:var(--on-kanku)}
.top .wrap{display:flex;align-items:center;gap:8px;padding-block:10px}
.brand{flex:1;min-width:0;font-family:var(--f-head);font-weight:800;font-size:1.05rem;line-height:1.2;
  background:none;border:0;padding:0;text-align:start;cursor:pointer;color:inherit}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;opacity:.85}
.langs{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
.langs button{border:0;background:none;color:var(--on-kanku);padding:6px 10px;border-radius:999px;font-weight:600;font-size:.82rem;min-height:38px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--on-kanku);color:var(--kanku-deep)}
.toran{height:14px;background:
  radial-gradient(circle at 10px 0,var(--haldi) 6px,transparent 7px) 0 0/20px 14px repeat-x,
  linear-gradient(var(--kanku-deep),var(--kanku-deep));}
.toran::after{content:"";display:block;height:14px;background:
  radial-gradient(ellipse 5px 9px at 20px 0,var(--leaf) 90%,transparent 100%) 0 0/40px 14px repeat-x}

main{padding-block:16px 24px}
.view{display:flex;flex-direction:column;gap:16px}

/* Home hero */
.hello{background:var(--surface-2);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
.hello h1{font-size:1.45rem;color:var(--kanku)}
.hello p{margin:0;color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0;padding:0;list-style:none}
.how li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;font-size:.82rem;line-height:1.35;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.how b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--kanku);color:var(--on-kanku);font-family:var(--f-head)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
.label{font-weight:600;font-size:.95rem}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice button{min-height:56px;border:2px solid var(--line);background:var(--surface);border-radius:12px;font-weight:600;padding:6px;line-height:1.25;cursor:pointer;font-size:.9rem}
.choice button[aria-pressed="true"]{border-color:var(--kanku);background:var(--surface-2);color:var(--kanku)}
.date-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.date-row input{flex:1;min-width:0;min-height:52px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface)}
.count{font-family:var(--f-head);font-weight:800;font-size:1.25rem;color:var(--kanku);margin:0}

.overall{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .3s}
.pct{font-weight:700;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:end}

/* Timeline */
.sec-title{font-size:1.2rem;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-title span{font-family:var(--f-body);font-weight:500;font-size:.82rem;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;position:relative}
.timeline::before{content:"";position:absolute;left:27px;top:20px;bottom:20px;width:3px;background:repeating-linear-gradient(var(--haldi) 0 6px,transparent 6px 12px)}
.rit{display:flex;gap:12px;align-items:center;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px;cursor:pointer;min-height:84px;position:relative}
.rit:active{transform:scale(.99)}
.rit .ic{flex:none;width:56px;height:56px;border-radius:50%;background:var(--surface-2);border:2px solid var(--haldi);display:grid;place-items:center;color:var(--kanku);position:relative;z-index:1}
.rit .ic svg{width:30px;height:30px}
.rit.done .ic{border-color:var(--leaf);background:var(--done-bg);color:var(--leaf)}
.rit .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rit .nm{font-family:var(--f-head);font-weight:700;font-size:1.08rem;line-height:1.25}
.rit .sh{font-size:.85rem;color:var(--muted);line-height:1.35}
.rit .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);line-height:1.6}
.chip.b{background:color-mix(in srgb,var(--kanku) 14%,transparent);color:var(--kanku)}
.chip.g{background:color-mix(in srgb,var(--haldi) 22%,transparent);color:color-mix(in srgb,var(--haldi) 45%,var(--fg))}
.chip.ok{background:var(--done-bg);color:var(--leaf)}
.chev{flex:none;color:var(--muted);font-size:1.6rem;line-height:1}
.num{position:absolute;left:4px;top:4px;font-size:.68rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

/* Ritual page */
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface-2);padding:10px 16px;border-radius:99px;font-weight:600;min-height:48px;cursor:pointer}
.rhead{display:flex;gap:14px;align-items:center}
.rhead .ic{flex:none;width:68px;height:68px;border-radius:50%;background:var(--surface-2);border:3px solid var(--haldi);display:grid;place-items:center;color:var(--kanku)}
.rhead .ic svg{width:38px;height:38px}
.rhead h1{font-size:1.6rem;color:var(--kanku)}
.rhead p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,78px));z-index:10;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);padding-block:8px}
.tabs button{min-height:56px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-size:.95rem;padding:4px}
.tabs button small{font-weight:500;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs button[aria-selected="true"]{background:var(--kanku);border-color:var(--kanku);color:var(--on-kanku)}
.tabs button[aria-selected="true"] small{color:var(--on-kanku)}
.about{margin:0;font-size:1.02rem}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:12px;padding-bottom:16px;position:relative}
.steps li::before{content:counter(s);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--kanku);color:var(--on-kanku);font-family:var(--f-head);font-weight:700}
.steps li:not(:last-child)::after{content:"";position:absolute;left:19px;top:42px;bottom:2px;width:2px;background:var(--line)}
.steps li span{padding-top:6px}
.tip{background:color-mix(in srgb,var(--haldi) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--haldi) 50%,var(--line));border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tip b{font-family:var(--f-head);color:color-mix(in srgb,var(--haldi) 40%,var(--fg))}
.note{font-size:.85rem;color:var(--muted);margin:0;border-top:1px dashed var(--line);padding-top:12px}

/* Checklists */
.listhead{display:flex;align-items:center;gap:12px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks .grp{font-family:var(--f-head);font-weight:700;font-size:.95rem;color:var(--kanku);padding:10px 2px 0;border-bottom:2px solid var(--line)}
.checks .grp:first-child{padding-top:0}
.ck{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:60px;cursor:pointer;user-select:none}
.ck input{position:absolute;opacity:0;pointer-events:none}
.box{flex:none;width:32px;height:32px;border-radius:8px;border:2.5px solid var(--muted);display:grid;place-items:center;background:var(--surface);transition:background .15s}
.box svg{width:20px;height:20px;opacity:0;color:#fff}
.ck input:checked + .box{background:var(--leaf);border-color:var(--leaf)}
.ck input:checked + .box svg{opacity:1}
.ck input:focus-visible + .box{outline:3px solid var(--focus);outline-offset:2px}
.ck .t{flex:1;min-width:0;line-height:1.4}
.ck.on{background:var(--done-bg);border-color:color-mix(in srgb,var(--leaf) 35%,var(--line))}
.ck.on .t{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.ck .chip{flex:none}
.del{flex:none;border:0;background:var(--surface-2);width:40px;height:40px;border-radius:50%;font-size:1.2rem;cursor:pointer;color:var(--muted)}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;min-height:54px;border:2px dashed var(--line);border-radius:12px;padding:8px 12px;background:var(--surface)}
.btn{min-height:54px;border:0;border-radius:12px;padding:8px 18px;font-weight:700;cursor:pointer;background:var(--kanku);color:var(--on-kanku);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2;text-align:center}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.wa{background:#1E8E4A;color:#fff}
.btn svg{width:22px;height:22px;flex:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .full{grid-column:1/-1}
.danger{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:12px;align-self:center;min-height:48px}
.confirm{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:12px;padding:12px}
.confirm .row{display:flex;gap:8px}.confirm .row .btn{flex:1}
.empty{color:var(--muted);text-align:center;padding:24px 8px;margin:0}
.group h3{font-size:1.05rem;display:flex;gap:8px;align-items:center;margin-bottom:8px}
.group h3 button{all:unset;cursor:pointer;color:var(--kanku);text-decoration:underline;text-underline-offset:3px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{min-height:44px;padding:6px 14px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* Settings */
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sizes button{min-height:56px;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font-weight:700}
.sizes button[aria-pressed="true"]{border-color:var(--kanku);color:var(--kanku);background:var(--surface-2)}
.sync{font-size:.85rem;color:var(--muted);margin:0}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 16px rgba(60,10,20,.08)}
.nav .wrap{display:flex;gap:4px;padding-block:6px}
.nav .wrap>button{flex:1 1 0;min-width:0}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;justify-content:center;border-radius:12px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.82rem;line-height:1.2;position:relative}
.nav button svg{width:28px;height:28px}
.nav button[aria-current="page"]{color:var(--kanku);background:var(--surface-2)}
.badge{position:absolute;top:4px;right:calc(50% - 30px);background:var(--kanku);color:var(--on-kanku);font-size:.7rem;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:40;max-width:90vw;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Groups */
.stack{display:flex;flex-direction:column;gap:8px}
.inp{width:100%;min-height:52px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font:inherit;color:inherit}
textarea.inp{resize:vertical;line-height:1.45}
.codein{text-transform:uppercase;letter-spacing:.12em;font-weight:700;font-variant-numeric:tabular-nums}
.glist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.whos{display:flex;flex-direction:column;gap:8px}
.whos .btn{justify-content:flex-start}
.ghead{background:var(--surface-2);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
.ghead .rhead h1{font-size:1.4rem;overflow-wrap:anywhere}
.avatars{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--surface);border:2px solid var(--haldi);font-weight:700;font-family:var(--f-head);color:var(--kanku);flex:none}
.av.me{background:var(--kanku);color:var(--on-kanku);border-color:var(--kanku)}
.av.more{font-size:.75rem;color:var(--muted)}
.avatars .hint{margin-inline-start:6px}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:2px dashed var(--haldi);border-radius:12px;padding:10px 14px;flex-wrap:wrap}
.code{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:1.35rem;font-weight:700;letter-spacing:.08em;color:var(--kanku)}
.live{margin:0;font-size:.8rem;color:var(--leaf);display:flex;align-items:center;gap:6px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.live.off{color:var(--kanku)}
.tabs.g4{grid-template-columns:repeat(4,1fr)}
.tabs.g4 button{font-size:.85rem}
.totals{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--surface-2);border-radius:12px;padding:10px 14px;font-size:.9rem;font-variant-numeric:tabular-nums}
.gsec{display:flex;flex-direction:column;gap:8px}
.ghd{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--line);padding-bottom:4px}
.ghd h3{flex:1;min-width:0;font-size:1.02rem;color:var(--kanku);overflow-wrap:anywhere}
.ghd .pct{font-size:.85rem;min-width:auto}
.icb{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.icb svg{width:20px;height:20px}
.icb:hover{background:var(--surface-2)}
.ck .tick{display:flex;align-items:center;cursor:pointer;padding:4px;margin:-4px}
.tbtn{all:unset;flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:2px;line-height:1.4;padding:4px 0}
.tbtn:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.tt{overflow-wrap:anywhere}
.ck.on .tbtn .tt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.ck.on .tbtn{text-decoration:none}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.78rem;color:var(--muted);text-decoration:none}
.meta .who{display:inline-flex;align-items:center;gap:3px;font-weight:600;color:var(--fg)}
.meta .who svg{width:14px;height:14px}
.meta .amt{font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.meta .by{color:var(--leaf);font-weight:600}
.gdel .ck.gone,.gdel .stp.gone,.gsec.gone{border:2px dashed var(--muted);background:transparent;opacity:.75}
.gdel .ck.gone .tt,.gdel .stp.gone .tt,.gsec.gone h3{text-decoration:line-through;text-decoration-style:dashed;color:var(--muted)}
.gdel .meta .by,.gsec.gone .chip{color:var(--kanku)}
.gsec.gone{border-radius:12px;padding:10px 12px}
.gdel{display:flex;flex-direction:column;gap:4px}
.rowact{display:flex;gap:6px;flex-wrap:wrap}
.rowact .confirm{flex-basis:100%}
.mini{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:4px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.82rem;cursor:pointer;color:var(--fg)}
.mini svg{width:16px;height:16px}
.danger2{color:var(--kanku);border-color:color-mix(in srgb,var(--kanku) 40%,var(--line))}
.btn.danger3{background:transparent;color:var(--kanku);border:2px solid var(--kanku)}
.newsec input{border-style:dashed}
.gsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.stp{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 10px;min-height:56px}
.stp .no{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--kanku);color:var(--on-kanku);font-family:var(--f-head);font-weight:700}
.stp.gone .no{background:var(--muted)}
.stp .tt{flex:1;min-width:0}
.stp .mv{display:flex;flex:none}

const KEY="lp-lagna-v1";

let S=load();
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||"null");if(v&&typeof v==="object")return Object.assign({},DEF,v);}catch(e){}return Object.assign({},DEF);}
let cloudRef=null,cloudOn=false,cloudTimer=null;
function save(){
  S.upd=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(cloudRef){clearTimeout(cloudTimer);cloudTimer=setTimeout(pushCloud,900);}
}
function pushCloud(){if(!cloudRef)return;cloudRef.set({state:JSON.stringify(S),upd:S.upd}).catch(()=>{});}
async function initCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=="function")return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    cloudRef=db.doc("data/users/"+id+"/plan");
    const snap=await cloudRef.get();
    const d=snap.exists?snap.data():null;
    let remote=null; try{remote=d&&typeof d.state==="string"?JSON.parse(d.state):null;}catch(e){}
    if(remote&&(remote.upd||0)>(S.upd||0)){S=Object.assign({},DEF,remote);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
    else if(S.upd)pushCloud();
    cloudOn=true;render();
  }catch(e){cloudRef=null;}
}

/* ---------- Helpers ---------- */
const L=()=>S.lang;
const t=(k,vars)=>{let s=(T[k]||[k])[L()]||T[k][0];if(vars)for(const v in vars)s=s.split("{"+v+"}").join(vars[v]);return s;};
const tx=(arr)=>arr?(arr[L()]||arr[0]):"";
const GU="૦૧૨૩૪૫૬૭૮૯";
const n=(x)=>L()===0?String(x).replace(/[0-9]/g,d=>GU[d]):String(x);

const $=(s,r=document)=>r.querySelector(s);
function sideOk(tag){return !tag||S.side==="all"||tag===S.side;}
function hk(str){let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return (h>>>0).toString(36);}
function entries(r,kind,withHeads){ // kind: "i" items, "t" todos
  const base=(kind==="i"?r.items:r.todos)||[];
  let out=[];
  base.forEach(e=>{
    if(!Array.isArray(e)&&e&&e.h){out.push({head:tx(e.h)});return;}
    if(sideOk(e[3]))out.push({key:r.id+"|"+kind+"|"+hk(e[1]||e[0]),text:tx(e),tag:e[3]||"",custom:false});
  });
  out=out.filter((e,i)=>!e.head||(out[i+1]&&!out[i+1].head));
  const c=((S.custom[r.id]||{})[kind])||[];
  if(c.length&&out.some(e=>e.head))out.push({head:t("yours")});
  c.forEach(e=>out.push({key:r.id+"|c"+kind+"|"+e.id,text:e.t,tag:"",custom:true,cid:e.id}));
  return withHeads?out:out.filter(e=>!e.head);
}
function stat(r,kind){const e=kind?entries(r,kind):entries(r,"i").concat(entries(r,"t"));const d=e.filter(x=>S.ck[x.key]).length;return{d,all:e.length};}
function totals(){let d=0,a=0;RITUALS.forEach(r=>{const s=stat(r);d+=s.d;a+=s.all;});return{d,a};}

function tagChip(tag){return tag==="b"?'<span class="chip b">'+esc(t("tagB"))+'</span>':tag==="g"?'<span class="chip g">'+esc(t("tagG"))+'</span>':"";}
let toastT;function toast(m){const el=$("#toast");el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2200);}
function daysTo(){if(!S.date)return null;const d=new Date(S.date+"T00:00:00");if(isNaN(d))return null;const now=new Date();now.setHours(0,0,0,0);return Math.round((d-now)/86400000);}
function countText(){const d=daysTo();if(d===null)return"";if(d>0)return t("daysLeft",{n:n(d)});if(d===0)return t("today");return t("past");}

function render(){
  document.documentElement.lang=LANGS[S.lang];
  document.documentElement.style.setProperty("--fs",S.fs+"px");
  $("#brand").innerHTML=esc(t("brand"))+'<small>'+esc(t("brandSub"))+'</small>';
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.lang===S.lang)));
  const m=$("#main");
  const ae=document.activeElement,focusId=ae&&ae.id,sel=ae&&typeof ae.selectionStart==="number"?[ae.selectionStart,ae.selectionEnd]:null;
  // keep what people are typing when the page re-renders (e.g. a family member's change arrives)
  const kept={};m.querySelectorAll("input[id],textarea[id],select[id]").forEach(el=>{if(el.type!=="checkbox"&&el.type!=="password"&&el.dataset.dirty)kept[el.id]=el.value;});
  const groupView=()=>!G.on?'<p class="empty">'+esc(G.failed?t("gNeedServer"):t("gLoading"))+'</p>':route==="groups"?viewGroups():route.startsWith("g-")?viewGroup():viewJoin();
  if(G.landing){m.innerHTML='<div class="view"><p class="empty">'+esc(t("gLoading"))+'</p></div>';}else
  m.innerHTML='<div class="view">'+(route.startsWith("r-")?viewRitual(route.slice(2)):route==="pending"?viewPending():route==="setup"?viewSetup():(route==="groups"||route.startsWith("g-")||route.startsWith("j-"))?groupView():viewHome())+'</div>';
  for(const id in kept){const el=document.getElementById(id);if(el){el.value=kept[id];el.dataset.dirty="1";}}
  if(focusId){const f=document.getElementById(focusId);if(f&&(f.tagName==="INPUT"||f.tagName==="TEXTAREA")&&f.type!=="checkbox"){f.focus();if(sel)try{f.setSelectionRange(sel[0],sel[1]);}catch(e){}}}
  const tt=totals();const left=tt.a-tt.d;
  const navs=[["home","home","navHome"],["groups","people","navGroups"],["pending","list","navPending"],["setup","gear","navSetup"]];
  $("#nav-groups").hidden=!G.on;
  // On the home server: Groups | Pending | Settings | Rituals. The static guide keeps Rituals first.
  const navHome=$("#nav-home");if(G.on&&navHome.nextElementSibling)navHome.parentNode.appendChild(navHome);
  navs.forEach(x=>{const b=$("#nav-"+x[0]);const cur=x[0]===route||(x[0]==="home"&&route.startsWith("r-"))||(x[0]==="groups"&&(route.startsWith("g-")||route.startsWith("j-")));
    b.innerHTML=ic(x[1])+'<span>'+esc(t(x[2]))+'</span>'+(x[0]==="pending"&&left>0?'<span class="badge">'+n(left>999?"999+":left)+'</span>':"");
    if(cur)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
  document.title=t("brand");
  const hd=document.querySelector(".top");if(hd)document.documentElement.style.setProperty("--hh",hd.offsetHeight+"px");
}

document.addEventListener("click",e=>{
  const el=e.target.closest("button,[data-open]");if(!el)return;
  const d=el.dataset;
  if(gClick(el,e))return;
  if(d.lang!==undefined){S.lang=+d.lang;save();render();return;}
  if(el.id==="brand"){go(G.on?landingRoute():"home");return;}
  if(d.go){go(d.go);return;}
  if(d.open){tab="steps";go("r-"+d.open);return;}
  if(d.tab){tab=d.tab;confirmFor=null;render();const tb=$(".tabs");if(tb&&tb.getBoundingClientRect().top<0||d.tab!==undefined&&el.classList.contains("btn"))$("#panel").scrollIntoView({block:"start"});return;}
  if(d.side){S.side=d.side;save();render();return;}
  if(d.fs){S.fs=+d.fs;save();render();return;}
  if(d.pf){pendFilter=d.pf;render();return;}
  if(d.del){e.preventDefault();const [rid,kc,cid]=d.del.split("|");const kind=kc.slice(1);const c=S.custom[rid];if(c&&c[kind])c[kind]=c[kind].filter(x=>x.id!==cid);delete S.ck[d.del];save();render();toast(t("removed"));return;}
  if(d.reset){confirmFor=d.reset;render();return;}
  if(d.resetNo!==undefined){confirmFor=null;render();return;}
  if(d.resetYes){const rid=route.slice(2);Object.keys(S.ck).forEach(k=>{const p=k.split("|");if(p[0]===rid&&(p[1]===d.resetYes||p[1]==="c"+d.resetYes))delete S.ck[k];});confirmFor=null;save();render();toast(t("cleared"));return;}
  if(d.resetall!==undefined){confirmFor="all";render();return;}
  if(d.resetallYes!==undefined){S.ck={};S.custom={};confirmFor=null;save();render();toast(t("cleared"));return;}
  if(d.copy!==undefined){const txt=$("#copy-src").value;
    const fb=()=>{const f=$("#copy-fallback");f.hidden=false;f.innerHTML='<p class="hint">'+esc(t("copyFail"))+'</p><textarea readonly style="width:100%;min-height:160px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface)">'+esc(txt)+'</textarea>';const ta=f.querySelector("textarea");ta.focus();ta.select();};
    try{navigator.clipboard.writeText(txt).then(()=>toast(t("copied")),fb);}catch(err){fb();}return;}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(gChange(el))return;
  if(el.dataset&&el.dataset.ck){if(el.checked)S.ck[el.dataset.ck]=1;else delete S.ck[el.dataset.ck];save();
    // update in place to keep scroll position, then refresh counts
    const y=window.scrollY;render();window.scrollTo(0,y);return;}
  if(el.type==="date"){S.date=el.value||"";save();const y=window.scrollY;render();window.scrollTo(0,y);}
});
document.addEventListener("input",e=>{const el=e.target;if(el&&el.id&&el.dataset)el.dataset.dirty="1";});
document.addEventListener("submit",e=>{
  const g=e.target.closest("form");if(g&&Object.keys(g.dataset).some(k=>k.startsWith("g"))){e.preventDefault();gSubmit(g);return;}
  const f=e.target.closest("form[data-add]");if(!f)return;e.preventDefault();
  const inp=f.querySelector("input");const v=(inp.value||"").trim();if(!v)return;
  const rid=route.slice(2),kind=f.dataset.add;
  S.custom[rid]=S.custom[rid]||{};S.custom[rid][kind]=S.custom[rid][kind]||[];
  S.custom[rid][kind].push({id:Date.now().toString(36),t:v.slice(0,120)});
  save();render();toast(t("added"));const ni=document.getElementById("add-"+kind);if(ni)ni.focus();
});

const G={on:false,failed:false,landing:!location.hash,health:null,cur:null,poll:null,adminGroups:null,join:null,busy:false,confirm:null};
const GKEY="lp-groups-v1",AKEY="lp-admin-v1";
const ID_RE=/^[a-z2-9]{12}$/;
function gLoad(){try{const v=JSON.parse(localStorage.getItem(GKEY)||"{}");return v&&typeof v==="object"?v:{};}catch(e){return{};}}
function gSave(v){try{localStorage.setItem(GKEY,JSON.stringify(v));}catch(e){}}
let MY=gLoad();
let ADMIN=(()=>{try{return localStorage.getItem(AKEY)||"";}catch(e){return"";}})();
function setAdmin(tk){ADMIN=tk||"";try{tk?localStorage.setItem(AKEY,tk):localStorage.removeItem(AKEY);}catch(e){}}
const fmtCode=(c)=>String(c||"").replace(/(...)(?=.)/g,"$1-");
const rupee=(x)=>"₹"+n(Number(x||0).toLocaleString("en-IN"));
function errText(code){return T["e_"+code]?t("e_"+code):t("e_other");}

async function api(method,path,body,gid){
  const h={"Content-Type":"application/json"};
  if(gid&&MY[gid])h.Authorization="Bearer "+MY[gid].token;
  if(gid&&MY[gid]&&MY[gid].owner)h["X-Owner-Token"]=MY[gid].owner;
  if(ADMIN)h["X-Admin-Token"]=ADMIN;
  let res;
  try{res=await fetch(path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body),cache:"no-store",credentials:"omit"});}
  catch(e){const er=new Error("net");er.code="net";throw er;}
  let data=null;try{data=await res.json();}catch(e){}
  if(!res.ok){const er=new Error((data&&data.error)||"other");er.code=(data&&data.error)||"other";er.status=res.status;throw er;}
  return data;
}

/* ---------- health check: groups only appear when the server is there ---------- */
(async()=>{
  try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),5000);
    const r=await fetch("/api/health",{signal:ctl.signal,cache:"no-store",credentials:"omit"});clearTimeout(tm);
    const d=r.ok?await r.json():null;
    if(d&&d.app==="lagna"){G.on=true;G.health=d;
      if(ADMIN){api("GET","/api/admin/me").then(x=>{if(!x.admin)setAdmin("");render();}).catch(()=>{});}
      G.landing=false;if(!location.hash){location.replace("#"+landingRoute());return;}
      route=readHash();render();gRoute();return;}
  }catch(e){}
  G.failed=true;G.landing=false;render();
})();

/* ---------- routing hooks ---------- */
// Where the app opens on the home server: straight into your group if you have
// exactly one, otherwise the group list.
function landingRoute(){const ids=Object.keys(MY).filter(k=>ID_RE.test(k));return ids.length===1?"g-"+ids[0]:"groups";}
function gRoute(){
  stopPoll();G.confirm=null;
  if(!G.on)return;
  if(route.startsWith("g-")){const id=route.slice(2);if(!G.cur||G.cur.gid!==id)G.cur={gid:id,data:null,tab:"items",filter:"all",edit:null,err:null};loadGroup();}
  else G.cur=null;
  if(route.startsWith("j-")){const code=route.slice(2);G.join={code,data:null,err:null};preview(code);}
  if(route==="groups"&&ADMIN)loadAdminGroups();
}
async function loadAdminGroups(){try{G.adminGroups=(await api("GET","/api/admin/groups")).groups;}catch(e){if(e.code==="admin_only")setAdmin("");G.adminGroups=null;}render();}
async function loadGroup(){
  const c=G.cur;if(!c)return;
  try{const d=await api("GET","/api/g/"+c.gid,undefined,c.gid);if(G.cur!==c)return;c.data=d;c.err=null;c.offline=false;
    if(MY[c.gid]){MY[c.gid].title=d.group.title;MY[c.gid].ritual=d.group.ritual;MY[c.gid].code=d.group.code;gSave(MY);}
    render();startPoll();}
  catch(e){if(G.cur!==c)return;
    if(e.code==="net"){c.offline=true;render();setTimeout(()=>{if(G.cur===c)loadGroup();},5000);return;}
    c.err=e.code;if((e.code==="not_member"||e.code==="no_group")&&MY[c.gid]){delete MY[c.gid];gSave(MY);}render();}
}
function stopPoll(){if(G.poll){G.poll.stop=true;G.poll=null;}}
function startPoll(){
  stopPoll();const c=G.cur;if(!c||!c.data)return;const p={stop:false};G.poll=p;
  (async()=>{
    while(!p.stop&&G.cur===c){
      try{const w=await api("GET","/api/g/"+c.gid+"/wait?rev="+c.data.group.rev,undefined,c.gid);
        if(p.stop)return;
        if(w.rev===-1){c.err="no_group";render();return;}
        if(w.rev!==c.data.group.rev){await refresh();}
        if(c.offline){c.offline=false;render();}
      }catch(e){if(p.stop)return;if(e.code==="not_member"||e.code==="no_group"){c.err=e.code;render();return;}
        c.offline=e.code==="net";render();await new Promise(r=>setTimeout(r,4000));}
    }
  })();
}
async function refresh(){const c=G.cur;if(!c)return;try{const d=await api("GET","/api/g/"+c.gid,undefined,c.gid);if(G.cur===c){c.data=d;render();}}catch(e){}}
async function preview(code){
  const j=G.join;
  try{const d=await api("POST","/api/join",{code});if(G.join!==j)return;
    j.data=d;if(MY[d.group.id]){go("g-"+d.group.id);return;}}
  catch(e){if(G.join!==j)return;j.err=e.code;}
  render();
}
async function op(body,admin){
  const c=G.cur;if(!c)return false;
  try{await api("POST","/api/g/"+c.gid+(admin?"/admin":"/op"),body,c.gid);await refresh();return true;}
  catch(e){toast(errText(e.code));if(e.code==="not_member"){c.err=e.code;render();}return false;}
}

  if(d.gtab){G.cur.tab=d.gtab;G.confirm=null;render();return true;}
  if(d.gfilter){G.cur.filter=d.gfilter;render();return true;}
  if(d.gedit){G.cur.edit=d.gedit;render();const f=document.getElementById("ge-text");if(f)f.focus();return true;}
  if(d.gclose!==undefined){G.cur.edit=null;render();return true;}
  if(d.gdel){const [k,id]=d.gdel.split(":");G.cur.edit=null;op({op:kindTable[k][0],id}).then(ok=>ok&&toast(t("removed")));return true;}
  if(d.grestore){const [k,id]=d.grestore.split(":");op({op:kindTable[k][1],id});return true;}
  if(d.gpurge){G.confirm=d.gpurge;render();return true;}
  if(d.gpurgeYes){const [k,id]=d.gpurgeYes.split(":");G.confirm=null;op({op:kindTable[k][2],id},true);return true;}
  if(d.gconfNo!==undefined){G.confirm=null;render();return true;}
  if(d.gmove){const [id,dir]=d.gmove.split(":");op({op:"moveStep",id,dir:+dir});return true;}
  if(d.gremove){G.confirm="mem:"+d.gremove;render();return true;}
  if(d.gremoveYes){G.confirm=null;op({op:"removeMember",id:d.gremoveYes},true);return true;}
  if(d.grotate!==undefined){G.confirm="rotate";render();return true;}
  if(d.grotateYes!==undefined){G.confirm=null;op({op:"rotateCode"},true);return true;}
  if(d.gpurgeall!==undefined){G.confirm="purgeall";render();return true;}
  if(d.gpurgeallYes!==undefined){G.confirm=null;op({op:"purgeAllDeleted"},true);return true;}
  if(d.gleave!==undefined){G.confirm="leave";render();return true;}
  if(d.gleaveYes!==undefined){const gid=G.cur.gid;api("POST","/api/g/"+gid+"/leave",{},gid).catch(()=>{});delete MY[gid];gSave(MY);G.confirm=null;go("groups");return true;}
  if(d.gclaim){doJoin({memberId:d.gclaim});return true;}
  if(d.gcopy){const v=d.gcopy;try{navigator.clipboard.writeText(v).then(()=>toast(t("copied")),()=>toast(v));}catch(err){toast(v);}return true;}
  if(d.gmcprevoke){G.confirm="mcp:"+d.gmcprevoke;render();return true;}
  if(d.gmcprevokeYes){G.confirm=null;api("POST","/api/admin/mcp/revoke",{id:d.gmcprevokeYes}).then(()=>{MC.list=null;MC.made=null;mcpLoad();toast(t("removed"));}).catch(e=>toast(errText(e.code)));return true;}
  if(d.glogout!==undefined){MC.list=null;MC.made=null;api("POST","/api/admin/logout",{}).catch(()=>{});setAdmin("");G.adminGroups=null;render();return true;}
  return false;
}
async function doJoin(extra){
  const j=G.join;if(!j||!j.data)return;
  try{const r=await api("POST","/api/join",Object.assign({code:j.code},extra));
    MY[r.groupId]={token:r.token,memberId:r.memberId,title:j.data.group.title,ritual:j.data.group.ritual};gSave(MY);go("g-"+r.groupId);}
  catch(e){toast(errText(e.code));}
}
function val(id){const el=document.getElementById(id);return el?el.value.trim():"";}
function gSubmit(f){
  const d=f.dataset;
  if(d.gjoin!==undefined){const code=val("g-code").toUpperCase().replace(/[^A-Z0-9]/g,"");if(code.length<6){toast(t("e_wrong_code"));return true;}go("j-"+code);return true;}
  if(d.gnewme!==undefined){const nm=val("gj-name");if(!nm){toast(t("e_fields"));return true;}doJoin({name:nm});return true;}
  if(d.glogin!==undefined){const pw=document.getElementById("g-pass").value;
    api("POST","/api/admin/login",{password:pw}).then(r=>{setAdmin(r.token);toast(t("gAdminOn"));render();}).catch(e=>toast(errText(e.code)));return true;}
  if(d.gcreate!==undefined){
    const body={title:val("gc-title"),ritual:val("gc-ritual"),date:val("gc-date"),side:val("gc-side"),name:val("gc-name")};
    if(!body.title||!body.name){toast(t("e_fields"));return true;}
    api("POST","/api/groups",body).then(r=>{MY[r.groupId]={token:r.token,memberId:r.memberId,title:body.title,ritual:body.ritual,owner:r.ownerToken||undefined};gSave(MY);go("g-"+r.groupId);}).catch(e=>toast(errText(e.code)));return true;}
  if(d.gadd){const inp=f.querySelector("input");const v=inp.value.trim();if(!v)return true;op({op:"addEntry",sectionId:d.gadd,text:v}).then(ok=>{if(ok){toast(t("added"));const i=document.getElementById(inp.id);if(i){i.value="";i.focus();}}});inp.value="";return true;}
  if(d.gaddsec){const inp=f.querySelector("input");const v=inp.value.trim();if(!v)return true;inp.value="";op({op:"addSection",kind:d.gaddsec,name:v});return true;}
  if(d.gaddstep!==undefined){const inp=f.querySelector("input");const v=inp.value.trim();if(!v)return true;inp.value="";op({op:"addStep",text:v});return true;}
  if(d.gsave){const [k,id]=d.gsave.split(":");const text=val("ge-text");
    let body;
    if(k==="ent"){const e=G.cur.data.entries.find(x=>x.id===id);const amtRaw=val("ge-amt").replace(/[^0-9]/g,"");
      body={op:"editEntry",id,assignee:val("ge-who")||null,amount:amtRaw===""?null:+amtRaw};if(e&&text!==txt(e))body.text=text;}
    else if(k==="sec"){const s=G.cur.data.sections.find(x=>x.id===id);if(s&&text===txt(s)){G.cur.edit=null;render();return true;}body={op:"editSection",id,name:text};}
    else {const s=G.cur.data.steps.find(x=>x.id===id);if(s&&text===txt(s)){G.cur.edit=null;render();return true;}body={op:"editStep",id,text};}
    op(body).then(ok=>{if(ok){G.cur.edit=null;render();toast(t("gSaved"));}});return true;}
  if(d.ginfo!==undefined){const g=G.cur.data.group;const title=val("gi-title"),date=val("gi-date"),me=val("gi-me");
    const jobs=[];if(title!==g.title||date!==g.date)jobs.push(op({op:"editGroup",title,date}));
    if(G.cur.data.me.memberId&&me&&me!==memberName(G.cur.data.me.memberId))jobs.push(op({op:"renameMe",name:me}));
    Promise.all(jobs).then(r=>{if(r.length&&r.every(Boolean))toast(t("gSaved"));});return true;}
  if(d.gmcpnew!==undefined){const body={name:val("mc-name")||"Claude Code",access:val("mc-access"),days:+val("mc-days")};
    api("POST","/api/admin/mcp",body).then(r=>{MC.made=r.token;MC.list=null;mcpLoad();}).catch(e=>toast(errText(e.code)));return true;}
  if(d.gdelgroup!==undefined){const gid=G.cur.gid;
    api("POST","/api/g/"+gid+"/admin",{op:"deleteGroup",confirm:val("gd-confirm")},gid).then(()=>{delete MY[gid];gSave(MY);toast(t("removed"));go("groups");}).catch(e=>toast(errText(e.code)));return true;}
  return false;
}
function gChange(el){
  if(el.dataset&&el.dataset.gck){const id=el.dataset.gck;el.closest(".ck").classList.toggle("on",el.checked);op({op:"toggle",id,done:el.checked});return true;}
  return false;
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&G.cur&&G.cur.edit){G.cur.edit=null;render();}});

route=readHash();render();
initCloud();
})();

</script>
